# Shopify CLI config for the D2C Dashboard Shopify Partner app.
#
# Domain reverted back to d2c.probild.in on 2026-11-06 (it had briefly been migrated
# to d2c.probild.online — see git history around 2026-11-02 if that migration's
# reasoning/checklist is ever needed again).
#
# IMPORTANT, deliberate deviation from the original design (see
# docs/superpowers/specs/2026-10-20-shopify-app-store-design.md, which called for a
# SEPARATE Partner app for the public App Store listing): the user confirmed on
# 2026-11-02 there is only ONE real Shopify Partner app ("D2C Dashboard", this
# client_id) and chose to reuse it for BOTH the existing agency-connect flow
# (server/src/integrations/shopify.ts, SHOPIFY_API_KEY/_SECRET in /etc/d2c.env) AND
# this App Store install flow (server/src/integrations/shopify-app-oauth.ts,
# SHOPIFY_APP_STORE_CLIENT_ID/_SECRET) — both env var pairs hold the SAME value in
# production. The tradeoff: Shopify's public-listing app-review requirements now
# apply to the same app the agency-connect flow depends on, not an isolated one.
# Both flows request identical scopes (read_orders,read_products,read_customers),
# so there's no scope conflict — only redirect_urls needed both callback paths
# listed, done below.
#
# This file is what was missing: "D2C Dashboard" at
# dev.shopify.com/dashboard/143444285/apps/418531868673 was created through the web
# dashboard with no local shopify.app.toml ever linked to it, so it had never had a
# deployed configuration version — which is exactly why Shopify showed "The
# installation link for this app is invalid" on every install attempt, including
# Partner Dashboard's own "Install link" / "Test on development store" button.
# Deploying this file (see commands below) creates that first version.
client_id = "0bfb1a6f392cfe0d3888d455b1e62009"
name = "D2C Dashboard"
application_url = "https://d2c.probild.in"
# Redirect-out model, not embedded (per the spec's user-confirmed decision): the
# merchant's day-to-day experience is the existing, unchanged d2c.probild.in
# dashboard, not a Polaris/App-Bridge rebuild inside Shopify Admin.
embedded = false

[access_scopes]
# Matches BOTH server/src/integrations/shopify.ts's SHOPIFY_SCOPES and
# server/src/integrations/shopify-app-oauth.ts's SHOPIFY_APP_SCOPES exactly — they
# happen to already be identical, which is what makes sharing one app safe scope-wise.
scopes = "read_orders,read_products,read_customers"

[auth]
# Two entries — one per flow sharing this app. Must match each flow's own
# getRedirectUri() exactly:
#   shopify.ts:            `${PUBLIC_API_URL}/api/integrations/shopify/callback`
#   shopify-app-oauth.ts:   `${PUBLIC_API_URL}/api/shopify-app/callback`
redirect_urls = [
  "https://d2c.probild.in/api/shopify-app/callback",
  "https://d2c.probild.in/api/integrations/shopify/callback",
]

[webhooks]
api_version = "2024-10"
