# Shopify CLI config for the DTC Cockpit Shopify App Store app — a SEPARATE Shopify
# Partner app from the existing agency-connect integration (server/src/integrations/
# shopify.ts, SHOPIFY_API_KEY/_SECRET), matching the original design (see
# docs/superpowers/specs/2026-10-20-shopify-app-store-design.md): keeping this app
# isolated means Shopify's public-listing app-review requirements never touch the
# already-shipped agency-connect flow.
#
# History: a "D2C Dashboard" app (org "Ecomaksh") was briefly reused for both flows
# (2026-11-02 to 2026-11-06 — see git history if that reasoning is ever needed again),
# then replaced on 2026-11-06 by this dedicated app, "DTC cockpit" (org "dtccockpit"),
# created directly through dev.shopify.com with "Embed app in Shopify admin" UNCHECKED
# and "Use legacy install flow" CHECKED.
#
# use_legacy_install_flow MUST stay true (see [auth] below): by default Shopify uses
# "managed installation," which never calls this app's OAuth callback at all — it
# handles everything itself via session tokens, a mechanism this backend does not
# implement. server/src/integrations/shopify-app-oauth.ts expects the classic flow:
# Shopify redirects to /api/shopify-app/callback with a code to exchange. Leaving this
# false/unset would make the install flow silently never fire.
client_id = "7db4b308fd33c642b3da784dc1777700"
name = "DTC cockpit"
application_url = "https://d2c.probild.in"
# Redirect-out model, not embedded (per the spec's user-confirmed decision): the
# merchant's day-to-day experience is the existing, unchanged d2c.probild.in
# dashboard, not a Polaris/App-Bridge rebuild inside Shopify Admin.
embedded = false

[access_scopes]
# Matches SHOPIFY_APP_SCOPES in server/src/integrations/shopify-app-oauth.ts exactly —
# keep these two in sync if either ever changes.
scopes = "read_orders,read_products,read_customers"

[auth]
# Must match getRedirectUri() in server/src/integrations/shopify-app-oauth.ts exactly:
# `${PUBLIC_API_URL}/api/shopify-app/callback`. Only this one path — this app is no
# longer shared with the agency-connect flow, which keeps its own, separate app.
redirect_urls = [ "https://d2c.probild.in/api/shopify-app/callback" ]
# See the top-of-file note — required for the classic OAuth callback flow this
# backend actually implements, not Shopify's newer managed-installation flow.
use_legacy_install_flow = true

[webhooks]
api_version = "2024-10"
